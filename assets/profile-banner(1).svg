<text x="60" y="240" font-size="20" font-weight="700" fill="#a78bfa">👤 ABOUT ME</text>
<line x1="60" y1="252" x2="960" y2="252" stroke="#23232e" stroke-width="1"/>
<text x="60" y="290" font-size="17" fill="#e6e6ef">I enjoy building software that makes technology more useful and accessible. My experience spans</text>
<text x="60" y="317" font-size="17" fill="#e6e6ef">full-stack development, backend engineering, and AI-powered applications, where I've worked on</text>
<text x="60" y="344" font-size="17" fill="#e6e6ef">turning ideas into practical, user-focused solutions through internships and personal projects.</text>
<text x="60" y="385" font-size="17" fill="#e6e6ef">I'm particularly interested in designing reliable backend systems, building scalable applications,</text>
<text x="60" y="412" font-size="17" fill="#e6e6ef">and solving real-world problems through thoughtful engineering. As I continue growing as a</text>
<text x="60" y="439" font-size="17" fill="#e6e6ef">software engineer, I'm focused on strengthening my fundamentals while building products that</text>
<text x="60" y="466" font-size="17" fill="#e6e6ef">challenge me to learn something new.</text>
<text x="60" y="507" font-size="17" fill="#e6e6ef">Outside of programming, I enjoy writing Hindi poetry and playing chess — interests that encourage</text>
<text x="60" y="534" font-size="17" fill="#e6e6ef">both creativity and strategic thinking.</text>
